<style>
body.boss .pad,body.boss .action,body.boss .choices{display:none!important}#bossChoices{display:none;width:100%;gap:8px}body.boss #bossChoices{display:flex;flex-wrap:wrap;justify-content:center}#bossChoices button{font-size:14px;padding:14px 10px;flex:1;min-width:150px}body.boss #hint{color:#ffc77c}body{overflow:auto}

body:has(.choices.show) .pad,body:has(.choices.show) .action{display:none}body:has(.choices.show) .controls{justify-content:center}body:has(.choices.show) .choices button{width:min(43vw,200px)}
*{box-sizing:border-box}body{margin:0;background:#15131a;color:#f5e7c4;font-family:monospace;display:flex;flex-direction:column;align-items:center;min-height:100dvh;overflow:hidden}header{width:min(96vw,760px);display:flex;align-items:center;justify-content:space-between;padding:12px 4px 6px;font-weight:bold;font-size:clamp(13px,2.5vw,20px)}#game{width:min(96vw,760px);height:auto;max-height:68dvh;object-fit:contain;border:5px solid #a75b39;box-shadow:0 8px 0 #4d2b2c;image-rendering:pixelated;background:#292531;touch-action:none}#hint{font-size:13px;text-align:center;padding:13px 8px;color:#d4bf9d}.controls{display:flex;justify-content:space-between;align-items:center;width:min(96vw,760px);margin-top:auto;padding:8px 4px 18px;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}button{background:#7c3440;color:#fff3d0;border:3px solid #db8d55;border-radius:8px;font:bold 22px monospace;touch-action:none;user-select:none}.choices{display:none;gap:8px}.choices button{font-size:13px;padding:10px;width:145px;min-height:72px}.choices.show{display:flex}.action{width:116px;height:116px;border-radius:50%;font-size:16px;background:#bd663f}button:active{filter:brightness(1.35)}@media(min-width:800px){.controls{opacity:.75}}
</style>
<header><span>БМ: НОЧНАЯ СМЕНА</span><span id="stats"></span></header>
<canvas id="game" width="640" height="480" aria-label="Игра БМ: Ночная смена"></canvas>
<div id="hint">Стрелки / WASD — ходить · E / пробел — действие</div>
<div class="controls"><div id="bossChoices"><button data-boss="0">1 · Принести водку</button><button data-boss="1">2 · Отказаться</button><button data-boss="2">3 · Позвонить начальнику</button></div><div class="pad"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="choices" id="choices"><button id="choice1">1 · Ответить</button><button id="choice2">2 · Ответить</button></div><button class="action" data-key="act">ДЕЙСТВИЕ</button></div>
<script>
(()=>{
const c=document.querySelector('#game'),g=c.getContext('2d'),stats=document.querySelector('#stats'),hint=document.querySelector('#hint');g.imageSmoothingEnabled=false;
const W=640,H=480, tables=[{x:126,y:178},{x:316,y:145},{x:510,y:190}], foods=[{name:'ПИЦЦА',price:660,color:'#e89a4a'},{name:'ХОТ-ДОГ',price:300,color:'#dc7344'},{name:'ПЕЛЬМЕНИ',price:220,color:'#eee1b2'},{name:'НАПИТОК',price:180,color:'#af574c'}],keys=new Set();
let state='start',p,guests,score,money,hearts,served,missed,combo,best,time,spawn,elapsed,last,notice='',noticeUntil=0,matchShown=false,brawl=null,brawlCount=0,stuffy=null,stuffyCount=0,dialogue=0,neighbor=null,neighborShown=false,volume=3,audioCtx=null,nextNote=0;
function reset(){document.body.classList.remove('boss');hint.textContent='Стрелки / WASD — ходить · E / пробел — действие';p={x:320,y:355,carry:null};guests=[];score=money=served=missed=combo=best=elapsed=spawn=0;hearts=3;time=180;notice='';matchShown=false;brawl=null;brawlCount=0;stuffy=null;stuffyCount=0;dialogue=0;neighbor=null;neighborShown=false;volume=3;updateChoices();state='play';last=performance.now();requestAnimationFrame(loop)}
function matchActive(){return elapsed>=30&&elapsed<70}
function enableAudio(){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}
function tickAudio(){if(!audioCtx||audioCtx.state!=='running'||audioCtx.currentTime<nextNote)return;let notes=[220,277,330,277,196,247,294,247],o=audioCtx.createOscillator(),v=audioCtx.createGain(),at=audioCtx.currentTime;o.type='square';o.frequency.value=notes[Math.floor(elapsed*3.5)%notes.length];v.gain.setValueAtTime(volume===1?.007:.027,at);v.gain.exponentialRampToValueAtTime(.001,at+.14);o.connect(v).connect(audioCtx.destination);o.start(at);o.stop(at+.15);nextNote=at+.29}
const lines=[
{q:'ПОЧЕМУ У ВАС ТАКАЯ МУЗЫКА?',a:['Сделаю потише','Терпите'],good:0},
{q:'МОЖНО МНЕ ДРУГОЙ СТОЛ?',a:['Всё занято','Проверю свободные'],good:1},
{q:'А ЧТО ВЫ ПОСОВЕТУЕТЕ?',a:['Нашу пиццу','Читайте меню'],good:0},
{q:'ПОЧЕМУ ТАК ДОЛГО ГОТОВИТСЯ?',a:['Уточню на кухне','Ждите молча'],good:0},
{q:'ТУТ ВСЕГДА СМОТРЯТ МАТЧИ?',a:['Можно выбрать место','Это спортбар'],good:0},
{q:'А МОЖНО ПОМЕНЯТЬ БЛЮДО?',a:['Нет, нельзя','Давайте уточним'],good:1}
];
function currentLine(){return lines[(stuffyCount-1)*2+dialogue-1]}
function updateChoices(){let box=document.querySelector('#choices');box.classList.toggle('show',dialogue>0);if(dialogue>0){let row=currentLine();document.querySelector('#choice1').textContent='1 · '+row.a[0];document.querySelector('#choice2').textContent='2 · '+row.a[1]}}
function answer(n){if(!dialogue||!stuffy)return;let row=currentLine();if(n!==row.good){score=Math.max(0,score-25);message('ГОСТЬ НЕДОВОЛЕН · −25 ОЧКОВ')}else message('СПОКОЙНЫЙ ОТВЕТ · +50 ОЧКОВ');if(n===row.good)score+=50;if(dialogue===2){stuffy=null;dialogue=0;score+=200;message('РАЗГОВОР ЗАВЕРШЁН · +200 ОЧКОВ')}else dialogue++;updateChoices()}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}
function txt(s,x,y,size=15,color='#f8eac9',align='center'){g.fillStyle=color;g.font=`bold ${size}px monospace`;g.textAlign=align;g.fillText(s,x,y)}
function block(x,y,w,h,color,edge='#332d37'){rect(x+3,y+4,w,h,edge);rect(x,y,w,h,color);rect(x+3,y+3,w-6,h-6,'#d89454')}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function message(s){notice=s;noticeUntil=elapsed+2.2}
function addGuest(){let open=tables.map((t,i)=>i).filter(i=>!guests.some(v=>v.table===i));if(!open.length)return;let i=open[Math.random()*open.length|0],f=Math.random()*foods.length|0;guests.push({table:i,food:f,patience:22+Math.random()*9,max:31})}
function interact(){if(state==='boss')return;enableAudio();if(state!=='play'){reset();return}if(dialogue)return;if(neighbor&&dist(p,{x:386,y:153})<75){neighbor=null;volume=1;score+=150;message('МУЗЫКА ТИШЕ · СОСЕДКА ДОВОЛЬНА · +150');return}if(stuffy&&dist(p,stuffy)<70){dialogue=1;updateChoices();return}if(brawl&&dist(p,brawl)<76){brawl.steps--;if(brawl.steps<=0){score+=300;message('РАЗНЯЛ! +300 ОЧКОВ');brawl=null}else message('РАЗНИМАЙ! ОСТАЛОСЬ: '+brawl.steps);return}if(p.y>272&&p.y<360){if(p.carry!==null){p.carry=null;message('ЗАКАЗ ВОЗВРАЩЁН')}else if(guests.length){let target=guests.find(v=>dist(p,tables[v.table])<250)||guests[0];p.carry=target.food;message('НЕСИ: '+foods[p.carry].name)}else message('ПОКА НЕТ ЗАКАЗОВ');return}let guest=guests.find(v=>dist(p,tables[v.table])<66);if(!guest){message('ПОДОЙДИ К СТОЛУ ИЛИ СТОЙКЕ');return}if(p.carry===null){message('ЗАБЕРИ ЗАКАЗ НА СТОЙКЕ');return}if(p.carry===guest.food){money+=foods[guest.food].price;combo++;best=Math.max(best,combo);let earned=100+(guest.patience>15?50:0)*Math.min(combo,4)+(matchActive()&&guest.patience>15?100:0);score+=earned;served++;message(`+${foods[guest.food].price} ₽ · +${earned} ОЧКОВ`);guests.splice(guests.indexOf(guest),1);p.carry=null}else{score=Math.max(0,score-50);combo=0;p.carry=null;message('НЕ ТОТ ЗАКАЗ: −50')}}
function draw(){if(state==='ending'){drawEnding();return;}if(state==='boss'){drawBoss();return;}rect(0,0,W,H,'#20382c');for(let x=0;x<W;x+=32)for(let y=0;y<H;y+=32)rect(x,y,30,30,(x+y)%64?'#344a37':'#2d4134');rect(0,0,W,40,'#633e2d');txt('БОЛЬШАЯ МАРФИНСКАЯ · 4/2',320,26,15,'#edbb78');
// Details from the real bar: dark green wall, posters, sticker fridge and globe lamps.
rect(0,40,W,80,'#1d3529');rect(0,40,W,5,'#c3894e');txt('LOCAL BEER',287,76,23,'#e7c991');txt('БМ',289,104,22,'#d39a5c');for(let i=0;i<3;i++){let x=172+i*76;rect(x,88,54,34,'#b1804b');rect(x+4,92,46,26,i===1?'#6a4940':'#4d4a39');txt(i===1?'★':'▧',x+27,112,17,'#dbc197')}
for(let x of [55,194,445]){rect(x-2,0,4,49,'#d7b96d');g.fillStyle='#fff0ac';g.beginPath();g.arc(x,63,18,0,Math.PI*2);g.fill();g.fillStyle='#fff6cf';g.beginPath();g.arc(x-6,57,6,0,Math.PI*2);g.fill()}
rect(548,42,91,204,'#633f35');rect(557,57,73,180,'#222d28');for(let y of [80,129,178]){rect(562,y,64,3,'#baa46b');for(let x=567;x<622;x+=12){rect(x,y-25,8,22,(x+y)%3?'#986e3b':'#be7350');rect(x+2,y-26,4,3,'#d4c389')}}for(let i=0;i<18;i++){let x=548+(i*37)%88,y=43+(i*29)%175;rect(x,y,5,5,i%3?'#c6a85d':'#b6574a')}
// TV and darts
block(17,134,108,72,'#252b3b');rect(26,143,90,51,matchActive()?'#4a9ab0':'#236575');txt(matchActive()?'⚽ 1:1':'МАТЧ',71,174,matchActive()?14:17,matchActive()?'#fff8b2':'#f8eac9');if(matchActive()){rect(17,206,108,5,elapsed%1<.5?'#e3bb54':'#af6241')}block(490,133,55,55,'#7c3d39');for(let r=23;r>0;r-=6){g.fillStyle=r%2?'#d4b878':'#66353c';g.beginPath();g.arc(517,160,r,0,7);g.fill()}
// entrance and tables
rect(605,270,35,76,'#9d7656');txt('ВХОД',595,366,12);tables.forEach((t,i)=>{block(t.x-45,t.y+11,90,48,'#925438');rect(t.x-31,t.y+16,62,36,'#71482f');rect(t.x-23,t.y-20,46,32,'#503d43');if(!guests.some(v=>v.table===i))txt('СТОЛ '+(i+1),t.x,t.y+43,10,'#c8ad7e')});
// counter
rect(18,304,540,22,'#4d2d32');rect(18,279,540,30,'#805035');for(let x=27;x<546;x+=35)rect(x,308,4,13,'#db9d62');for(let x=32;x<552;x+=67){rect(x,285,39,3,'#a97348');rect(x+11,299,32,2,'#4f382d')}txt('БАР · КУХНЯ',288,300,17,'#fff0bb');rect(18,403,540,53,'#44313a');txt('ПИЦЦА     ХОТ-ДОГ     ПЕЛЬМЕНИ     НАПИТОК',288,437,13,'#dbc79c');
guests.forEach(v=>{let t=tables[v.table],ratio=Math.max(0,v.patience/v.max);rect(t.x-25,t.y-36,50,5,'#772c37');rect(t.x-25,t.y-36,50*ratio,5,ratio<.3?'#ef4c43':'#80b86a');rect(t.x-12,t.y-14,24,25,'#c5805e');rect(t.x-10,t.y-29,20,19,'#e7b585');rect(t.x-12,t.y-32,24,8,'#412c35');rect(t.x-39,t.y-68,78,25,'#f3dfab');txt(foods[v.food].name,t.x,t.y-50,10,'#3b3036')});
if(neighbor){rect(323,123,128,23,'#e7c7a1');txt('СОСЕДКА ЗВОНИТ! '+Math.ceil(neighbor.left),387,140,10,'#422d35');txt('E: ТИШЕ',387,175,12,'#fff0b0')}rect(361,145,50,22,volume===1?'#4f7752':'#9a564d');txt('♫ '+(volume===1?'ТИХО':'ГРОМКО'),386,160,10);if(stuffy){rect(stuffy.x-45,stuffy.y-68,90,24,'#e8d0a1');txt('ЕСТЬ ВОПРОС...',stuffy.x,stuffy.y-51,11,'#3c3238');rect(stuffy.x-10,stuffy.y-29,20,19,'#dab793');rect(stuffy.x-13,stuffy.y-10,26,32,'#8b8271');rect(stuffy.x-12,stuffy.y-32,24,7,'#58443e');txt('?',stuffy.x+17,stuffy.y-18,18,'#e9b965')}if(brawl){let shake=Math.round(Math.sin(elapsed*28)*4);rect(brawl.x-49,brawl.y-72,98,25,'#eaad5d');txt('РАЗНИМИ! '+Math.ceil(brawl.left),brawl.x,brawl.y-54,12,'#3b2632');for(let [side,color] of [[-1,'#a74943'],[1,'#617caa']]){let x=brawl.x+side*23+shake*side;rect(x-9,brawl.y-23,18,22,'#deb28a');rect(x-12,brawl.y-2,24,25,color);rect(x+side*10,brawl.y+2,12,6,'#deb28a')}txt('✦',brawl.x,brawl.y-8,24,'#ffe589');txt('E ×'+brawl.steps,brawl.x,brawl.y+38,12,'#fff2bf')}
// player
rect(p.x-13,p.y-10,26,30,'#f0e6cd');rect(p.x-10,p.y-24,20,18,'#dca778');rect(p.x-13,p.y-26,26,7,'#563b39');rect(p.x-9,p.y+19,6,9,'#292837');rect(p.x+3,p.y+19,6,9,'#292837');if(p.carry!==null){rect(p.x+15,p.y-12,21,18,foods[p.carry].color);txt('●',p.x+25,p.y+2,13,'#fff2c7')}
if(dialogue){rect(72,218,496,151,'#201d2b');rect(78,224,484,139,'#76504a');txt('ДУШНЫЙ ГОСТЬ',320,249,18,'#ffdb9c');txt(currentLine().q,320,279,16);txt('1: '+currentLine().a[0],320,311,14,'#d7f0b2');txt('2: '+currentLine().a[1],320,338,14,'#f4c5a9')}if(noticeUntil>elapsed&&!dialogue){rect(91,237,458,31,'#1f1b28');txt(notice,320,259,notice.length>40?10:13)}
if(state!=='play'){rect(62,121,516,242,'#1b1a27');rect(68,127,504,230,'#583b3d');if(state==='start'){txt('БМ: НОЧНАЯ СМЕНА',320,177,28,'#ffd68b');txt('ЗАБИРАЙ ЗАКАЗЫ НА СТОЙКЕ',320,218,17);txt('РАЗНОСИ ИХ ГОСТЯМ ЗА 3 МИНУТЫ',320,248,16);txt('НАЖМИ E / ПРОБЕЛ ИЛИ ДЕЙСТВИЕ',320,310,15,'#f9cf77')}else{txt('СМЕНА ЗАКОНЧЕНА',320,172,28,'#ffd68b');txt(`ВЫРУЧКА: ${money} ₽    ОЧКИ: ${score}`,320,218,18);txt(`ГОСТЕЙ: ${served}    УШЛО: ${missed}    КОМБО: ×${best}`,320,253,15);txt('НАЖМИ, ЧТОБЫ СЫГРАТЬ ЕЩЁ',320,308,16,'#f9cf77')}}
stats.textContent=`${Math.ceil(time)} c · ${money} ₽ · ${'♥'.repeat(hearts)}${neighbor?' · ♫':stuffy?' · ГОСТЬ':brawl?' · ДРАКА':matchActive()?' · ⚽':''}`}
function loop(now){if(state!=='play'){draw();return}let dt=Math.min(.05,(now-last)/1000);last=now;if(dialogue)dt=0;elapsed+=dt;time-=dt;spawn-=dt;tickAudio();if(time<=10&&hearts>0){enterBoss();return;}if(matchActive()&&!matchShown){matchShown=true;message('⚽ МАТЧ НАЧАЛСЯ! БОНУС ЗА БЫСТРУЮ ПОДАЧУ');spawn=0}if(brawlCount<2&&elapsed>=[78,139][brawlCount]){brawlCount++;brawl={x:410,y:231,steps:3,left:20};message('ДРАКА! ПОДОЙДИ И НАЖМИ ДЕЙСТВИЕ 3 РАЗА')}if(brawl){brawl.left-=dt;if(brawl.left<=0){brawl=null;hearts--;message('НЕ УСПЕЛ РАЗНЯТЬ! −1 ♥')}}if(stuffyCount<3&&elapsed>=[46,104,154][stuffyCount]){stuffyCount++;stuffy={x:195,y:241,left:25};message('ДУШНЫЙ ГОСТЬ СНОВА ЗДЕСЬ · ПОГОВОРИ С НИМ')}if(elapsed>=119&&!neighborShown){neighborShown=true;neighbor={left:22};message('ЖАЛУЕТСЯ СОСЕДКА! ПОДОЙДИ К КОЛОНКЕ И УБАВЬ МУЗЫКУ')}if(neighbor){neighbor.left-=dt;if(neighbor.left<=0){neighbor=null;hearts--;message('СОСЕДКА ПОЖАЛОВАЛАСЬ · −1 ♥')}}if(stuffy&&!dialogue){stuffy.left-=dt;if(stuffy.left<=0){stuffy=null;score=Math.max(0,score-100);message('ГОСТЬ УШЁЛ НЕВЫСЛУШАННЫМ · −100')}}if(spawn<=0){addGuest();spawn=matchActive()?2.5:Math.max(3.2,7-elapsed/70)}let dx=(keys.has('right')?1:0)-(keys.has('left')?1:0),dy=(keys.has('down')?1:0)-(keys.has('up')?1:0);if(dx||dy){let len=Math.hypot(dx,dy);p.x=Math.max(22,Math.min(615,p.x+dx/len*155*dt));p.y=Math.max(130,Math.min(387,p.y+dy/len*155*dt))}for(let i=guests.length-1;i>=0;i--){let v=guests[i];v.patience-=dt;if(v.patience<=0){guests.splice(i,1);missed++;hearts--;combo=0;message('ГОСТЬ УШЁЛ! −1 ♥')}}if(time<=0||hearts<=0){state='end';keys.clear()}draw();if(state==='play')requestAnimationFrame(loop)}

const bossAnswers=['Принести водку','Отказаться','Позвонить начальнику'];
function enterBoss(){state='boss';time=10;dialogue=0;keys.clear();updateChoices();document.body.classList.add('boss');hint.textContent='Выбери ответ кнопкой или клавишей 1, 2, 3. Время приостановлено.';draw();}
let bossEnding=-1;
function chooseBoss(n){if(state!=='boss'||n<0||n>2)return;bossEnding=n;if(n===1)money=0;document.body.classList.remove('boss');state='ending';keys.clear();hint.textContent='Нажми на экран, E или «Действие», чтобы начать новую смену.';draw();}
function drawEnding(){
rect(0,0,640,480,'#1b2026');rect(18,18,604,444,'#293b32');rect(24,24,592,432,'#21332d');txt('БМ · СМЕНА ЗАКОНЧЕНА',320,60,24,'#e7bc7f');
if(bossEnding===0){
// Pixel taxi outside the bar.
rect(211,122,218,80,'#dba546');rect(244,97,139,33,'#dba546');rect(254,106,49,32,'#75958f');rect(313,106,58,32,'#75958f');rect(234,189,39,25,'#141b20');rect(373,189,39,25,'#141b20');rect(292,83,50,17,'#f4d993');txt('ТАКСИ',317,96,10,'#27282a');
txt('ПРИНЕСТИ ВОДКУ',320,259,22,'#edc790');txt('Гость напился.',320,299,20);txt('Ты потратил деньги на такси.',320,330,20);
}else if(bossEnding===1){
rect(270,97,100,121,'#e9dfbd');rect(309,117,22,72,'#b85447');rect(285,143,70,21,'#b85447');
txt('ОТКАЗАТЬСЯ',320,259,22,'#edc790');txt('Ты получил пиздюлей',320,296,22);txt('и потратил все деньги на лечение.',320,326,19);txt('Осталось: 0 ₽',320,360,18,'#edb293');
}else{
rect(264,94,113,132,'#e6d8ae');for(let y=112;y<172;y+=14)rect(281,y,75,3,'#8b8669');rect(307,187,49,4,'#a6503b');txt('КОНТРАКТ',320,215,12,'#453e32');
txt('ПОЗВОНИТЬ НАЧАЛЬНИКУ',320,259,22,'#edc790');txt('Поздравляем,',320,296,23);txt('вы подписали контракт с МО РФ.',320,330,20);
}
txt('ОЧКИ: '+score+' · ОБСЛУЖЕНО: '+served,320,406,16,'#c1c5a4');txt('ЕЩЁ ОДНА СМЕНА? НАЖМИ НА ЭКРАН',320,437,14,'#e7bc7f');stats.textContent='ФИНАЛ';
